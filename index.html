    <!-- AEO：常见问答结构化数据，供回答引擎直接解析 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "栖居罗盘是什么？",
          "acceptedAnswer": { "@type": "Answer", "text": "栖居罗盘（Habitat Compass）是面向数字游民、自由职业者与远程工作者的海外城市定居决策工具：基于你的作答与公开数据快照，对库内 270 座城市按三层权重加权打分并生成 Top 5 报告。" }
        },
        {
          "@type": "Question",
          "name": "测评怎么进行、需要多久？",
          "acceptedAnswer": { "@type": "Answer", "text": "先做免费标准测验（32 道原创 SJT 情境迫选题 + 8 道生活偏好题 + 16 个兴趣标签，约 8 分钟）；完成后可选继续深度测验（Big Five 二元迫选剖面 + 深化辨析偏好 + 风险自陈 + RIASEC 兴趣画像，约 15 分钟），得到更精准的报告。" }
        },
        {
          "@type": "Question",
          "name": "要付费或注册吗？",
          "acceptedAnswer": { "@type": "Answer", "text": "全部功能免费、无需注册。测评与匹配全部在你的浏览器本地完成，数据不上传，也不含第三方追踪脚本。" }
        },
        {
          "@type": "Question",
          "name": "匹配分数是怎么算的？",
          "acceptedAnswer": { "@type": "Answer", "text": "三层结构：第 1 层硬性条件过滤（预算/签证/安全，一票否决）；第 2 层核心匹配（生活偏好 42% + 人格 30% + 兴趣 18%，共 11 维，缺失维度降权不惩罚）；第 3 层加分项（RIASEC/风险联动/空气质量，合计 ≤10%）。原始分校准为 52 + raw × 0.46 后取整为 0–99。" }
        }
      ]
    }
